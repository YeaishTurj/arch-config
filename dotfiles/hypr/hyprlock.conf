background {
    monitor =
    color = rgba(1a1b26ff)
}

# ─── Avatar ────────────────────────────────────────────────────────────
image {
    monitor =
    path = ~/.config/hypr/avatar.png

    size = 150
    rounding = -1

    border_size = 3
    border_color = rgba(7aa2f7ff)

    position = 0, 290
    halign = center
    valign = center
}

# ─── Time ───────────────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%I:%M %p")"

    color = rgba(c0caf5ff)
    font_size = 62
    font_family = JetBrainsMono Nerd Font

    position = 0, 125
    halign = center
    valign = center
}

# ─── Date ───────────────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d %B %Y")"

    color = rgba(7aa2f7ff)
    font_size = 20
    font_family = JetBrainsMono Nerd Font

    position = 0, 65
    halign = center
    valign = center
}

# ─── Name ───────────────────────────────────────────────────────────────
label {
    monitor =
    text = YJ Turj

    color = rgba(bb9af7ff)
    font_size = 26
    font_family = JetBrainsMono Nerd Font

    position = 0, 20
    halign = center
    valign = center
}

# ─── Password ──────────────────────────────────────────────────────────
input-field {
    monitor =

    size = 320, 52
    outline_thickness = 2

    dots_size = 0.25
    dots_spacing = 0.20
    dots_center = true

    outer_color = rgba(7aa2f7ff)
    inner_color = rgba(1f2335ff)
    font_color = rgba(c0caf5ff)

    fade_on_empty = false
    placeholder_text = Enter password...
    hide_input = false

    position = 0, -75
    halign = center
    valign = center
}
