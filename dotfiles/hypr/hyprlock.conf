background {
    monitor =
    color = rgba(1a1b26ff)
}

image {
    monitor =
    path = ~/.config/hypr/avatar.png
    size = 160
    rounding = -1
    border_size = 3
    border_color = rgba(7aa2f7ff)

    position = 0, 300
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%I:%M %p")"
    color = rgba(ffffffff)
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = 0, 140
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d %B %Y")"
    color = rgba(ccccccff)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 75
    halign = center
    valign = center
}

# Name
label {
    monitor =
    text = YJ Turj
    color = rgba(7aa2f7ff)
    font_size = 28
    font_family = JetBrainsMono Nerd Font
    position = 0, 25
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(7aa2f7ff)
    inner_color = rgba(1f2335ff)
    font_color = rgba(ffffffff)
    fade_on_empty = false
    placeholder_text = Password...
    hide_input = false
    position = 0, -80
    halign = center
    valign = center
}
