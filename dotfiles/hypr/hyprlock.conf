background {
    monitor =
    color = rgba(1a1b26ff)
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(ffffffff)
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(7aa2f7ff)
    inner_color = rgba(1f2335ff)
    font_color = rgba(ffffffff)
    fade_on_empty = false
    placeholder_text = Password...
    hide_input = false
    position = 0, -80
    halign = center
    valign = center
}
