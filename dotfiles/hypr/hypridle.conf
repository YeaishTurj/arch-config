general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 600
    on-timeout = ~/.local/bin/hypridle-lock
}

listener {
    timeout = 900
    on-timeout = ~/.local/bin/hypridle-dpms
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 1800
    on-timeout = ~/.local/bin/hypridle-suspend
}
