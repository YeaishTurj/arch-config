[main]
# ─── Font ───────────────────────────────────────────────────────────────
font=JetBrainsMono Nerd Font:size=12
use-bold=yes
dpi-aware=auto

# ─── Launching ──────────────────────────────────────────────────────────
terminal=kitty -e {cmd}
layer=overlay
keyboard-focus=exclusive
exit-on-keyboard-focus-loss=yes

# ─── Layout ─────────────────────────────────────────────────────────────
anchor=center
width=46
lines=10
horizontal-pad=20
vertical-pad=12
inner-pad=10
line-height=28

# ─── Appearance ─────────────────────────────────────────────────────────
icon-theme=Papirus-Dark
icons-enabled=no

prompt="❯  "
placeholder="Search..."
hide-before-typing=no

fields=name,generic,keywords,comment,filename
match-mode=fzf

# ─── Results ────────────────────────────────────────────────────────────
sort-result=yes
match-counter=no
filter-desktop=yes
show-actions=no
list-executables-in-path=no
auto-select=no

# ─── Performance ────────────────────────────────────────────────────────
render-workers=4
match-workers=4
delayed-filter-ms=75
delayed-filter-limit=5000

enable-mouse=no
scaling-filter=linear

# ─── Border ─────────────────────────────────────────────────────────────
[border]
width=2
radius=12
selection-radius=8

# ─── Colors ─────────────────────────────────────────────────────────────
[colors]
background=1a1b26f8
text=c0caf5ff
input=c0caf5ff
prompt=7aa2f7ff
placeholder=565f89ff
message=7aa2f7ff
match=bb9af7ff

selection=292e42ff
selection-text=c0caf5ff
selection-match=f7768eff

counter=7dcfffcc
border=7aa2f7ff

# ─── Key Bindings ──────────────────────────────────────────────────────
[key-bindings]
cursor-up-prev=Up
cursor-down-next=Down
