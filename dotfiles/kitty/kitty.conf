# ─────────────────────────── Font ───────────────────────────
font_family      JetBrainsMono Nerd Font
font_size        13.0
# Disable ligatures & features that need extra shaping passes
disable_ligatures never
font_features    none

# ─────────────────────────── Theme ──────────────────────────
# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include dark-theme.auto.conf
# END_KITTY_THEME

# ─────────────────────────── Performance ───────────────────
# Minimum-latency profile (kovidgoyal's recommended tuning).
# Trades a little CPU for ~2 ms better keyboard-to-screen latency.
input_delay                       0
repaint_delay                     2
sync_to_monitor                   no
wayland_enable_ime                no
# (Pass --single-instance on the CLI for shared GPU sprite cache.)
# Skip work we don't need.
enable_audio_bell                 no
visual_bell_duration               0
confirm_os_window_close           0
background_opacity                1.0
# Hide the CSD border under Hyprland — compositor draws its own.
hide_window_decorations           yes
# Tell Hyprland how to identify & group our windows.
wayland_app_id                    kitty
# Only render the cells we touch while scrolling.
# (Default already optimal; listed for clarity.)
# rasterizer_threads                0

# ─────────────────────────── Cursor ─────────────────────────
cursor_shape                      beam
cursor_blink_interval             0
cursor_beam_thickness             1.5

# ─────────────────────────── Window ────────────────────────
window_padding_width              8
window_margin_width               0
remember_window_size              yes
initial_window_width              110c
initial_window_height             30c

# ─────────────────────────── Scrolling ─────────────────────
scrollback_lines                  10000
wheel_scroll_multiplier           5.0
scrollback_pager                  less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
scrollback_pager_history_size     0

# ─────────────────────────── Clipboard ─────────────────────
copy_on_select                    yes
map ctrl+shift+c                  copy_to_clipboard
map ctrl+shift+v                  paste_from_clipboard
map shift+insert                  paste_from_clipboard

# ─────────────────────────── URL Detection ─────────────────
detect_urls                       yes
url_style                         curly
open_url_with                     default
allow_hyperlinks                  yes

# ─────────────────────────── Tabs ──────────────────────────
map ctrl+shift+t                  new_tab
map ctrl+shift+w                  close_tab
map ctrl+tab                      next_tab
map ctrl+shift+tab                previous_tab
map ctrl+1 goto_tab 1
map ctrl+2 goto_tab 2
map ctrl+3 goto_tab 3
map ctrl+4 goto_tab 4
map ctrl+5 goto_tab 5

# ─────────────────────────── Splits ────────────────────────
map ctrl+shift+enter launch --location=vsplit --cwd=current
map ctrl+alt+enter   launch --location=hsplit --cwd=current
map ctrl+shift+h                  neighboring_window left
map ctrl+shift+l                  neighboring_window right
map ctrl+shift+k                  neighboring_window up
map ctrl+shift+j                  neighboring_window down
map ctrl+alt+h                    resize_window narrower 5
map ctrl+alt+l                    resize_window wider 5
map ctrl+alt+k                    resize_window taller 5
map ctrl+alt+j                    resize_window shorter 5
map ctrl+shift+alt+h              move_window left
map ctrl+shift+alt+l              move_window right
map ctrl+shift+alt+k              move_window up
map ctrl+shift+alt+j              move_window down
map ctrl+shift+z                  toggle_layout stack

# ─────────────────────────── Layouts ───────────────────────
enabled_layouts splits,stack,tall,fat,grid,horizontal,vertical
map ctrl+shift+space              next_layout

# ─────────────────────────── Tab bar ───────────────────────
tab_bar_style                     powerline
tab_powerline_style               slanted
tab_bar_edge                      bottom
tab_title_template                {title}

# ─────────────────────────── Borders ───────────────────────
draw_minimal_borders              yes
# Use the active/inactive colors from the included theme.

# ─────────────────────────── Selection ─────────────────────
rectangle_select_modifiers        ctrl+alt
selection_preserve_word_boundary  yes

# ─────────────────────────── Misc ──────────────────────────
map ctrl+shift+x                  clear_terminal active
map ctrl+shift+n                  launch --cwd=current
map ctrl+shift+d                  launch --cwd=current
map ctrl+backspace                send_text all \x17
map ctrl+delete                   send_text all \x1b\x64
# Allow kitty to be controlled by scripts (fuzzel, scripts, etc).
allow_remote_control              socket-only
listen_on                         unix:/tmp/kitty.sock
remote_control_password           ""
