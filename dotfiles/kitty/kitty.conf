# -------------------------
# Font
# -------------------------
font_family JetBrainsMono Nerd Font
font_size 13.0

# -------------------------
# Theme
# -------------------------
# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include dark-theme.auto.conf
# END_KITTY_THEME

# -------------------------
# Performance
# -------------------------
background_opacity 1.0
confirm_os_window_close 0
enable_audio_bell no
repaint_delay 10
input_delay 3
sync_to_monitor yes

# -------------------------
# Cursor
# -------------------------
cursor_shape beam
cursor_blink_interval 0

# -------------------------
# Window
# -------------------------
window_padding_width 8

# -------------------------
# Scrolling
# -------------------------
scrollback_lines 10000
wheel_scroll_multiplier 5.0

# -------------------------
# Clipboard
# -------------------------
copy_on_select yes

map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map shift+insert paste_from_clipboard

# -------------------------
# URL Detection
# -------------------------
detect_urls yes


# -------------------------
# Tabs
# -------------------------

# New tab
map ctrl+shift+t new_tab

# Close tab
map ctrl+shift+w close_tab

# Next / Previous tab
map ctrl+tab next_tab
map ctrl+shift+tab previous_tab

# Go directly to tabs
map ctrl+1 goto_tab 1
map ctrl+2 goto_tab 2
map ctrl+3 goto_tab 3
map ctrl+4 goto_tab 4
map ctrl+5 goto_tab 5

# -------------------------
# Split Windows
# -------------------------

# Vertical split (left/right)
map ctrl+shift+enter launch --location=vsplit

# Horizontal split (top/bottom)
map ctrl+alt+enter launch --location=hsplit

# -------------------------
# Window Navigation
# -------------------------

map ctrl+shift+h neighboring_window left
map ctrl+shift+l neighboring_window right
map ctrl+shift+k neighboring_window up
map ctrl+shift+j neighboring_window down

# -------------------------
# Resize Splits
# -------------------------

map ctrl+alt+h resize_window narrower 5
map ctrl+alt+l resize_window wider 5
map ctrl+alt+k resize_window taller 5
map ctrl+alt+j resize_window shorter 5

# -------------------------
# Move Windows
# -------------------------

map ctrl+shift+alt+h move_window left
map ctrl+shift+alt+l move_window right
map ctrl+shift+alt+k move_window up
map ctrl+shift+alt+j move_window down

# -------------------------
# Zoom Current Split
# -------------------------

map ctrl+shift+z toggle_layout stack

# -------------------------
# Layouts
# -------------------------

enabled_layouts splits,stack,tall,fat,grid,horizontal,vertical

# Cycle layouts
map ctrl+shift+space next_layout

# -------------------------
# Misc
# -------------------------

# Clear terminal
map ctrl+shift+x clear_terminal active

# Open current directory in new tab
map ctrl+shift+n launch --cwd=current

# Duplicate current shell
map ctrl+shift+d launch --cwd=current

# Delete previous word
map ctrl+backspace send_text all \x17

# Delete next word
map ctrl+delete send_text all \x1b\x64

# Better border rendering
draw_minimal_borders yes

# Better tab bar
tab_bar_style powerline
tab_powerline_style slanted

# Place tab bar at bottom
tab_bar_edge bottom

# Slightly thinner cursor
cursor_beam_thickness 1.5

# Less visual noise
visual_bell_duration 0

# Remember window size
remember_window_size yes

# Open links with default browser
open_url_with default
