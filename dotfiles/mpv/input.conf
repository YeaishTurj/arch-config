# Mouse wheel -> Volume
WHEEL_UP add volume 5
WHEEL_DOWN add volume -5

# Arrow keys -> Volume
UP add volume 5
DOWN add volume -5

# Playback speed
] add speed 0.05
[ add speed -0.05

# Reset playback speed
BS set speed 1.0

# Optional: Left/Right seek
LEFT seek -5
RIGHT seek 5

# Shift+Left/Right seek
Shift+LEFT seek -30
Shift+RIGHT seek 30

# Frame stepping
. frame-step
, frame-back-step

